<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamLife | Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

<div class="login-screen">

  <!-- ===== PAINEL ESQUERDO — MARCA ===== -->
  <section class="brand-panel">
    <div class="brand-pattern" aria-hidden="true">
      <svg width="100%" height="100%" viewBox="0 0 600 900" fill="none" preserveAspectRatio="xMidYMid slice">
        <circle cx="80" cy="120" r="70" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
        <circle cx="520" cy="200" r="110" stroke="white" stroke-opacity="0.07" stroke-width="1.5"/>
        <circle cx="460" cy="720" r="90" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
        <circle cx="60" cy="760" r="50" stroke="white" stroke-opacity="0.07" stroke-width="1.5"/>
        <path d="M250 60 v40 M232 100 h36 l14 34 a20 20 0 0 1 -18 28 h-28 a20 20 0 0 1 -18 -28 z" stroke="white" stroke-opacity="0.1" stroke-width="1.5" stroke-linejoin="round"/>
        <g stroke="white" stroke-opacity="0.09" stroke-width="1.5">
          <path d="M120 500 q20 -18 40 0 t40 0 t40 0"/>
          <path d="M120 520 q20 18 40 0 t40 0 t40 0"/>
        </g>
        <path d="M420 830 v-70 M395 785 h50" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
      </svg>
    </div>

    <div class="brand-content">
      <!-- Substitua "logo-white.png" pela versão do logotipo em branco/monocromática -->
      <img src="{{ url_for('static', filename='logo.png') }}" alt="ExamLife Análises Clínicas" class="brand-logo">
      <p class="brand-tagline">Cuidando de cada resultado com precisão e confiança.</p>
    </div>

    <p class="brand-footer">© 2025 ExamLife Análises Clínicas</p>
  </section>

  <!-- ===== PAINEL DIREITO — FORMULÁRIO ===== -->
  <section class="form-panel">
    <div class="form-wrap">

      <header class="form-header">
        <h1>Bem-vindo de volta</h1>
        <p>Selecione seu perfil e entre com suas credenciais.</p>
      </header>

      <form class="login-form" action="#" method="post">

        <fieldset class="role-select">
          <legend>Quem está entrando?</legend>

          <div class="role-grid">

            <label class="role-card">
              <input type="radio" name="perfil" value="administrador">
              <span class="role-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3 4 6v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V6l-8-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span class="role-label">Administrador</span>
            </label>

            <label class="role-card">
              <input type="radio" name="perfil" value="recepcionista" checked>
              <span class="role-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              </span>
              <span class="role-label">Recepcionista</span>
            </label>

            <label class="role-card">
              <input type="radio" name="perfil" value="analista">
              <span class="role-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 2v6.5L4.5 17a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L15 8.5V2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 2h6M7.5 14h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              </span>
              <span class="role-label">Analista laboratorial</span>
            </label>

            <label class="role-card">
              <input type="radio" name="perfil" value="tecnico">
              <span class="role-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2v6M12 22v-6M4.2 7.8l4.2 2.4M15.6 13.8l4.2 2.4M4.2 16.2l4.2-2.4M15.6 10.2l4.2-2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg>
              </span>
              <span class="role-label">Técnico de coleta</span>
            </label>

            <label class="role-card role-card-wide">
              <input type="radio" name="perfil" value="paciente">
              <span class="role-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              </span>
              <span class="role-label">Paciente</span>
            </label>

          </div>
        </fieldset>

        <div class="field">
          <label for="email">E-mail</label>
          <div class="field-input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
          </div>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="field-input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            <button type="button" class="toggle-pass" aria-label="Mostrar senha">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg>
            </button>
          </div>
        </div>

        <div class="field-row">
          <label class="remember">
            <input type="checkbox" name="lembrar">
            Lembrar de mim
          </label>
          <a href="#" class="forgot-link">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>

      </form>

    </div>
  </section>

</div>

</body>
</html>
